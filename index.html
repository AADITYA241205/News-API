<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .list {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;

            display: flex;
            flex-direction: column;

            border: none !important;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);

            transition: transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .list:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        /* Author */
        .list>div:nth-of-type(1) {
            font-size: 13px;
            font-weight: bold;
            color: #777;
            padding: 15px 18px 5px;
        }

        /* Title */
        .list>div:nth-of-type(2) {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.3;
            color: #1d1d1d;

            padding: 5px 18px 10px;
        }

        /* Description */
        .list>div:nth-of-type(3) {
            font-size: 14px;
            line-height: 1.6;
            color: #666;

            padding: 0 18px 20px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .img {
                height: 220px;
            }
        }

        .box {
            position: fixed;
            top: 10%;
            left: 20%;

            width: 80vw;
            height: 80vh;

            background-color: white;
            border-radius: 15px;
            padding: 30px;

            overflow-y: auto;

        }
    </style>
</head>

<body>

    <div class="container"></div>

    <script>

        let container = document.querySelector('.container')
        fetch("https://saurav.tech/NewsAPI/top-headlines/category/health/in.json").then((response) => {
            return response.json()
        }).then((data) => {
            console.log(data)
            data.articles.forEach(element => {
                let ndiv = document.createElement('div')
                ndiv.classList.add('list')

                ndiv.innerHTML = `
                <img class="img" src="${element.urlToImage}">
                <div>${element.author}</div>
                
                <div>${element.title}</div>
                <div>${element.description}</div>
                `
                ndiv.style.border = '2px solid black'
                ndiv.addEventListener("click", () => {

                let oldBox = document.querySelector(".box");

    if (oldBox) {
        oldBox.remove();
    }

                    let nbox = document.createElement('div')
                    nbox.classList.add('box')

                    nbox.innerHTML = `
        <h1>${element.title}</h1>
        <br>
        
        <p>Author: ${element.author}</p>
<br>
        
        <img 
            src="${element.urlToImage}" 
            style="width:100%; max-height:400px; object-fit:cover;"
        >
        <p>
            ${element.description}
        </p>
<hr>
        <p>
            ${element.content}
        </p>
<hr>
        <p>
            Published: ${element.publishedAt}
        </p>
<hr>
        <a href="${element.url}">
            Go to Website
        </a>

        <br><br>

        <button class="close">Close</button>
    `

                    document.body.appendChild(nbox)

                    nbox.querySelector(".close").addEventListener("click", () => {
                        nbox.remove()
                    })
                });

                container.appendChild(ndiv)
            });
        }).catch((err) => {
            console.error(err)
        }).finally(() => {
            console.log("Finalyy")
        })




    </script>

</body>

</html>
